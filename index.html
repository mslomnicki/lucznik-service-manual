<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Łucznik 466 – instrukcja obsługi</title>
<meta name="description" content="Instrukcja obsługi maszyny do szycia Łucznik 466.">
<style>
:root{--ratio:1.45;--accent:#e8a87c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;color:#eadfd6;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(ellipse at 50% 40%,#4a3a32 0,#2a201b 60%,#1a1411 100%)}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 20px}
h1{margin:0;font-size:1.15rem;letter-spacing:-.01em}
h1 span{color:var(--accent)}
header a{color:var(--accent);text-decoration:none;font-size:.9rem}
header a:hover{text-decoration:underline}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;perspective:2600px}
.book{--h:min(calc(100vh - 170px),calc(94vw / var(--ratio)));position:relative;height:var(--h);width:calc(var(--h) * var(--ratio));
  transform-style:preserve-3d;transition:transform .7s cubic-bezier(.5,0,.3,1);filter:drop-shadow(0 24px 30px #000a)}
.pg{position:absolute;top:0;width:50%;height:100%;background-color:#fbf8f2;background-repeat:no-repeat}
.pg.blank{background:none!important}
.L{left:0;border-radius:4px 0 0 4px;cursor:w-resize}
.R{left:50%;border-radius:0 4px 4px 0;cursor:e-resize}
/* cień grzbietu */
.pg:not(.blank)::after{content:"";position:absolute;inset:0;pointer-events:none}
.L:not(.blank)::after,.leaf.prev .front::after,.leaf.next .back::after{background:linear-gradient(to left,#0005,#0000 9%)}
.R:not(.blank)::after,.leaf.next .front::after,.leaf.prev .back::after{background:linear-gradient(to right,#0005,#0000 9%)}
.leaf{position:absolute;top:0;width:50%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.5,0,.3,1)}
.leaf.next{left:50%;transform-origin:left center}
.leaf.next.go{transform:rotateY(-180deg)}
.leaf.prev{left:0;transform-origin:right center}
.leaf.prev.go{transform:rotateY(180deg)}
.leaf .pg{left:0;width:100%;backface-visibility:hidden;border-radius:0}
.leaf .back{transform:rotateY(180deg)}
nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 20px 20px}
nav button{width:44px;height:44px;border-radius:50%;border:1px solid #fff3;background:#fff1;color:inherit;font-size:22px;cursor:pointer}
nav button:hover:not(:disabled){background:#fff3}
nav button:disabled{opacity:.3;cursor:default}
nav input{width:min(46vw,420px);accent-color:var(--accent)}
#c{min-width:5.5em;text-align:center;font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){.book,.leaf{transition-duration:0s!important}}
</style>
</head>
<body>
<header>
  <h1>Łucznik <span>466</span> · instrukcja obsługi</h1>
  <a href="lucznik466.zip" download>Pobierz ZIP (9 MB)</a>
</header>
<div class="stage"><div class="book" id="b"><div class="pg L" id="L"></div><div class="pg R" id="R"></div></div></div>
<nav>
  <button id="p" aria-label="Poprzednia strona">‹</button>
  <input id="s" type="range" min="1" value="1" aria-label="Wybierz stronę">
  <span id="c"></span>
  <button id="n" aria-label="Następna strona">›</button>
</nav>
<script>
// skany mają numerację z luką (brak 010); każdy to rozkładówka (dwie strony), poza okładką (nr 1)
const nums=[...Array(35).keys()].slice(1).filter(n=>n!==10);
const N=nums.length,DUR=matchMedia("(prefers-reduced-motion:reduce)").matches?0:700;
const src=i=>`foto-${String(nums[i]).padStart(3,"0")}.jpg`;
const $=id=>document.getElementById(id);
const book=$("b"),L=$("L"),R=$("R"),slider=$("s");
let cur=0,busy=false;
slider.max=N;

// pokazuje lewą/prawą połowę skanu i (okładka) cały skan na prawej stronie
function face(el,i,side){
  const blank=i<0||i>=N||(i===0&&side==="L");
  el.classList.toggle("blank",blank);
  if(blank){el.style.backgroundImage="none";return}
  el.style.backgroundImage=`url("${src(i)}")`;
  el.style.backgroundSize=i===0?"100% 100%":"200% 100%";
  el.style.backgroundPosition=i===0||side==="L"?"0 0":"100% 0";
}
const shift=i=>book.style.transform=i===0?"translateX(-25%)":""; // zamknięta książka wyśrodkowana
function render(){
  face(L,cur,"L");face(R,cur,"R");shift(cur);
  slider.value=cur+1;$("c").textContent=`${cur+1} / ${N}`;
  $("p").disabled=cur===0;$("n").disabled=cur===N-1;
  history.replaceState(null,"","#"+(cur+1));
  [cur-1,cur+1,cur+2].forEach(j=>{if(j>=0&&j<N)new Image().src=src(j)});
}
function mk(cls,i,side){const d=document.createElement("div");d.className="pg "+cls;face(d,i,side);return d}
function go(d){
  const t=cur+d;
  if(busy||t<0||t>=N)return;
  busy=true;
  const leaf=document.createElement("div");leaf.className="leaf "+(d>0?"next":"prev");
  if(d>0){leaf.append(mk("front",cur,"R"),mk("back",t,"L"));face(R,t,"R")}
  else{leaf.append(mk("front",cur,"L"),mk("back",t,"R"));face(L,t,"L")}
  book.append(leaf);
  leaf.getBoundingClientRect(); // wymusza start animacji od stanu początkowego
  leaf.classList.add("go");shift(t);
  setTimeout(()=>{cur=t;leaf.remove();busy=false;render()},DUR+30);
}
function jump(i){if(busy)return;cur=Math.min(N-1,Math.max(0,i));render()}

$("p").onclick=()=>go(-1);$("n").onclick=()=>go(1);
L.onclick=()=>go(-1);R.onclick=()=>go(1);
slider.oninput=()=>jump(slider.value-1);
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown")go(1);
  if(e.key==="ArrowLeft"||e.key==="PageUp")go(-1);
  if(e.key==="Home")jump(0);
  if(e.key==="End")jump(N-1);
});
let x0=null;
book.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
book.addEventListener("touchend",e=>{
  if(x0===null)return;
  const dx=e.changedTouches[0].clientX-x0;x0=null;
  if(Math.abs(dx)>40)go(dx<0?1:-1);
});
addEventListener("hashchange",()=>jump((parseInt(location.hash.slice(1))||1)-1));
cur=Math.min(N-1,Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
render();
</script>
</body>
</html>
