<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Łucznik 466 – instrukcja obsługi</title>
<meta name="description" content="Instrukcja obsługi maszyny do szycia Łucznik 466 – skany stron do przeglądania i pobrania.">
<style>
:root{--bg:#f6f3ee;--fg:#2a2522;--muted:#7a706a;--card:#fff;--accent:#c4452d;--shadow:0 1px 3px #0002,0 8px 24px #0001}
@media(prefers-color-scheme:dark){:root{--bg:#171413;--fg:#ece6e1;--muted:#9a8f88;--card:#231f1d;--accent:#ff7a5c;--shadow:0 1px 3px #0006,0 8px 24px #0004}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{max-width:1100px;margin:0 auto;padding:56px 20px 24px}
h1{margin:0 0 8px;font-size:clamp(2rem,6vw,3.4rem);letter-spacing:-.03em;line-height:1.1}
h1 span{color:var(--accent)}
p{margin:0 0 20px;color:var(--muted);max-width:55ch}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:10px 20px;border-radius:999px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
main{max-width:1100px;margin:0 auto;padding:12px 20px 64px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{position:relative;display:block;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:4/3;border:0;padding:0;cursor:zoom-in;transition:transform .2s}
.card:hover,.card:focus-visible{transform:translateY(-4px) scale(1.02);outline:2px solid var(--accent)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card b{position:absolute;left:8px;bottom:8px;background:#000a;color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
#lb{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:9}
#lb.open{display:flex}
#lb img{max-width:92vw;max-height:88vh;border-radius:6px;background:#fff}
#lb button{position:absolute;background:#fff2;color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:24px;cursor:pointer}
#lb button:hover{background:#fff4}
#x{top:16px;right:16px}#p{left:16px}#n{right:16px}
#c{position:absolute;bottom:14px;color:#fff;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 40px}
</style>
</head>
<body>
<header>
  <h1>Łucznik <span>466</span></h1>
  <p>Instrukcja obsługi maszyny do szycia Łucznik 466, udostępniona przez Mirellę. Kliknij stronę, aby ją powiększyć.</p>
  <a class="btn" href="lucznik466.zip" download>Pobierz całą instrukcję (ZIP, 9 MB)</a>
</header>
<main id="g"></main>
<footer>lucznik.slomnicki.net</footer>
<div id="lb" role="dialog" aria-modal="true" aria-label="Podgląd strony">
  <button id="x" aria-label="Zamknij">×</button>
  <button id="p" aria-label="Poprzednia">‹</button>
  <img id="im" alt="">
  <button id="n" aria-label="Następna">›</button>
  <span id="c"></span>
</div>
<script>
// skany mają numerację z luką (brak 010)
const nums=[...Array(34).keys()].slice(1).filter(n=>n!==10);
const f=n=>String(n).padStart(3,"0");
const g=document.getElementById("g"),lb=document.getElementById("lb"),im=document.getElementById("im");
let cur=0;
nums.forEach((n,i)=>{
  const b=document.createElement("button");
  b.className="card";b.setAttribute("aria-label","Strona "+(i+1));
  b.innerHTML=`<img loading="lazy" src=".thumb_foto%20${f(n)}.jpg" alt="Strona ${i+1}"><b>${i+1}</b>`;
  b.onclick=()=>show(i);g.append(b);
});
function show(i){
  cur=(i+nums.length)%nums.length;
  im.src=`foto%20${f(nums[cur])}.jpg`;im.alt="Strona "+(cur+1);
  document.getElementById("c").textContent=`${cur+1} / ${nums.length}`;
  lb.classList.add("open");
  new Image().src=`foto%20${f(nums[(cur+1)%nums.length])}.jpg`;
}
const shut=()=>lb.classList.remove("open");
x.onclick=shut;p.onclick=()=>show(cur-1);n.onclick=()=>show(cur+1);
lb.onclick=e=>{if(e.target===lb)shut()};
addEventListener("keydown",e=>{
  if(!lb.classList.contains("open"))return;
  if(e.key==="Escape")shut();
  if(e.key==="ArrowLeft")show(cur-1);
  if(e.key==="ArrowRight")show(cur+1);
});
</script>
</body>
</html>
